name: ibiza
description: "ibiza_journey_app"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  modal_progress_hud_nsn: ^0.5.1
  flutter_screenutil: ^5.9.1
  lottie: ^3.1.2
  syncfusion_flutter_calendar: ^25.2.5
  intl: ^0.19.0
  syncfusion_localizations: ^25.2.5
  flutter_localizations:
    sdk: flutter
  duration_picker: ^1.2.0
  flutter_staggered_grid_view: ^0.7.0
  huge_icons_flutter: ^0.0.2
  http: ^1.2.1
  pinput: ^5.0.0
  fluttertoast: ^8.2.6
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  geolocator: ^11.1.0
  flutter_custom_clippers: ^2.1.0
  flutter_svg: ^2.0.10+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/json/
    - assets/svg/
  fonts:
    - family: outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
    - family: inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 900
        - asset: assets/fonts/Inter-Thin.ttf
          style: italic  